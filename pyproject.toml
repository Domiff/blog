[project]
name = "blog"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "authx>=1.7.1",
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqladmin[full]>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "strawberry-graphql[fastapi]>=0.332.0",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
]

[tool.fastapi]
entrypoint = "backend.main:app"
